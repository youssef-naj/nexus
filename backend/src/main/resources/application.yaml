spring:
  application:
    name: nexus
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:nexus}
    username: ${POSTGRES_USER:nexus}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      connection-timeout: 5000     # fail fast when the database is unreachable
      maximum-pool-size: 10
  jdbc:
    template:
      query-timeout: 15s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  session:
    timeout: 2h            # idle timeout
    jdbc:
      initialize-schema: never   # Flyway owns the schema (ADR-0009)
      query-timeout: 15s
  task:
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 100
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  servlet:
    session:
      tracking-modes: cookie       # never a session id in a URL
      cookie:
        http-only: true
        same-site: lax
        # secure: true is set in deployed environments (HTTPS), see the deployment phase
  tomcat:
    max-http-form-post-size: 64KB
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db   # not ready to take traffic while the database is down

nexus:
  public-base-url: http://localhost:5173   # override in deployed environments
  mail:
    from: noreply@nexus.local
  rate-limit:
    login-per-ip: { limit: 30, window: 5m }
    login-failures-per-account: { limit: 5, window: 15m }   # per email + IP
    register-per-ip: { limit: 10, window: 1h }
    verify-per-ip: { limit: 30, window: 10m }
    email-per-address: { limit: 3, window: 1h }
    invite-per-org: { limit: 20, window: 1h }
    request-create-per-member: { limit: 100, window: 1h }
  security:
    secure-cookies: false          # true in the "prod" profile
  http:
    max-body-bytes: 102400         # 100 KB

# API documentation is published deliberately (deployment phase), not exposed by default
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    # Hibernate prints SQL error details (for example the duplicate email of a unique violation).
    # Our own handlers log a safe description instead (ADR-0033). Hibernate 7 renamed its logger,
    # so both names are listed; the quotes matter (an unquoted OFF is read as a boolean).
    org.hibernate.orm.jdbc.error: "OFF"
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
    org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver: ERROR
    # One full stack trace per probe during an outage; the endpoint already reports DOWN
    org.springframework.boot.health.contributor.AbstractHealthIndicator: ERROR
