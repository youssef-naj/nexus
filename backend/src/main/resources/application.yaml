spring:
  application:
    name: nexus
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:nexus}
    username: ${POSTGRES_USER:nexus}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  session:
    timeout: 2h            # idle timeout
    jdbc:
      initialize-schema: never   # Flyway owns the schema (ADR-0009)
  task:
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 100

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # secure: true is set in deployed environments (HTTPS), see the deployment phase

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

nexus:
  public-base-url: http://localhost:5173   # override in deployed environments
  mail:
    from: noreply@nexus.local