spring:
  config:
    import: optional:file:../.env[.properties]
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
nexus:
  platform:
    # Comma-separated. These verified accounts become platform administrators at startup;
    # anyone else holding the role loses it. Set it in .env (never commit real addresses).
    admin-emails: ${NEXUS_PLATFORM_ADMIN_EMAILS:}
