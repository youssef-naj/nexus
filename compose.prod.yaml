# The deployable stack: database, backend, web (nginx). See .env.prod.example for production
# values, or compose.demo.yaml for a local demo. The project name differs from the development
# compose.yaml on purpose: the two stacks must never share containers or volumes.
name: nexus-stack

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your env file}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    networks: [data]

  backend:
    build: ./backend
    image: nexus-backend:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nexus}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-nexus}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      NEXUS_PUBLIC_BASE_URL: ${NEXUS_PUBLIC_BASE_URL:?Set NEXUS_PUBLIC_BASE_URL in your env file}
      NEXUS_MAIL_FROM: ${NEXUS_MAIL_FROM:?Set NEXUS_MAIL_FROM in your env file}
      MAIL_HOST: ${MAIL_HOST:?Set MAIL_HOST in your env file}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-true}
      NEXUS_SECURE_COOKIES: ${NEXUS_SECURE_COOKIES:-true}
      NEXUS_FORWARD_HEADERS: native
      NEXUS_PLATFORM_ADMIN_EMAILS: ${NEXUS_PLATFORM_ADMIN_EMAILS:-}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    mem_limit: 768m
    healthcheck:
      # The runtime image has no curl: a plain TCP request with bash is enough
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /api/actuator/health/readiness HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [data, edge]

  web:
    build: ./frontend
    image: nexus-web:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Loopback only by default. Publishing it wider is a deliberate choice, and should sit
      # behind a TLS proxy.
      - "${NEXUS_HTTP_BIND:-127.0.0.1}:${NEXUS_HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [edge]

networks:
  # postgres and the backend only
  data:
    internal: true
  # the backend and the web server
  edge:

volumes:
  pgdata:
