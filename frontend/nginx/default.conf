server_tokens off;

# The client address is trusted from X-Forwarded-For only when the connection comes from a private
# network (a TLS proxy in front of this container, or Docker's own gateway). Anything arriving
# from the public internet is taken at its word, never at its header.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Compress static files only. API responses are not compressed (BREACH).
gzip on;
gzip_min_length 1024;
gzip_types text/css application/javascript image/svg+xml text/plain;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. The backend is resolved per request, so a restarted backend with a
    # new address is found again without restarting this container.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Health endpoints are for the orchestrator, which talks to the backend directly
    location ^~ /api/actuator {
        return 404;
    }

    location /api/ {
        client_max_body_size 128k;
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The address resolved above, never the client-supplied chain (it could be forged)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Built files carry a content hash in their name, so they never change
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else is the single-page app: unknown paths get index.html (client-side routing)
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }
}
