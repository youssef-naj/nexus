name: Security scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"   # weekly: new advisories appear even when the code does not change
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv-scanner:
    name: Dependency vulnerabilities (OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Fails the job when a known vulnerability affects a dependency. Maven dependencies are
      # resolved transitively from the pom; npm uses the lockfile.
      - name: Scan backend, frontend and end-to-end dependencies
        run: >
          docker run --rm -v "$PWD:/src:ro" ghcr.io/google/osv-scanner:v2.6.0
          scan source -L /src/backend/pom.xml -L /src/frontend/package-lock.json -L /src/e2e/package-lock.json
